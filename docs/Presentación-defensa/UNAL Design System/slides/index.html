<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNAL Slide Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,400;1,700&family=Raleway:wght@300;400;600;700&family=EB+Garamond:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="deck-stage.js?v=20260501-anim-reset-2"></script>
<script src="deck-step.js?v=20260502-active-sync-1"></script>
<script src="../presentation/audio.js?v=20260502-audio-engine-1"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; }
  deck-stage section {
    overflow: hidden;
    width: 100%;
    height: 100%;
    display: block;
    position: relative;
  }
  deck-stage section > div,
  deck-stage section > [data-screen-label] {
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<deck-stage>

  <!-- Slide 1: Cover -->
  <section id="slide-cover" data-screen-label="01 Cover"></section>

  <!-- Slide 2: Title -->
  <section id="slide-title" data-screen-label="02 Title"></section>

  <!-- Slide 3: Content -->
  <section id="slide-content" data-screen-label="03 Content"></section>

  <!-- Slide 4: Diagram -->
  <section id="slide-diagram" data-screen-label="04 Diagram"></section>

  <!-- Slide 5: Split panel -->
  <section id="slide-split" data-screen-label="05 Split"></section>

  <!-- Slide 6: Closing -->
  <section id="slide-closing" data-screen-label="06 Closing"></section>

  <!-- Slide 7: Interval Roughness -->
  <section id="slide-interval" data-screen-label="07 Roughness"></section>

  <!-- Slide 8: Chords to Vectors -->
  <section id="slide-chords-vectors" data-screen-label="08 PC-Set Mapping"></section>

  <!-- Slide 9: Pilot research question -->
  <section id="slide-pilot-question" data-screen-label="09 Pilot Question"></section>

  <!-- Slide 10: Pilot musical focus -->
  <section id="slide-pilot-focus" data-screen-label="10 Pilot Musical Focus"></section>

  <!-- Slide 11: Pilot complement intervals -->
  <section id="slide-pilot-complements" data-screen-label="11 Pilot Complements"></section>

  <!-- Slide 12: Pilot pitch-class directions -->
  <section id="slide-pilot-bins" data-screen-label="12 Pilot Pitch-Class Directions"></section>

  <!-- Slide 13: Exploration problem -->
  <section id="slide-exploration-problem" data-screen-label="13 Exploration Problem"></section>

  <!-- Slide 14: Research question rich -->
  <section id="slide-research-question-rich" data-screen-label="14 Research Question Rich"></section>

  <!-- Slide 15: Substitution hypothesis -->
  <section id="slide-substitution-hypothesis" data-screen-label="15 Substitution Hypothesis"></section>

  <!-- Slide 16: Representation requirements -->
  <section id="slide-representation-requirements" data-screen-label="16 Representation Requirements"></section>

</deck-stage>

<script type="text/babel" src="CoverSlide.jsx?v=20260502-formal-cover-1"></script>
<script type="text/babel" src="TitleSlide.jsx?v=20260502-piano-footer-3"></script>
<script type="text/babel" src="IntroNarrativeSlides.jsx?v=20260502-intro-pilot-2"></script>
<script type="text/babel" src="ContentSlide.jsx?v=20260501-anim-reset-3"></script>
<script type="text/babel" src="DiagramSlide.jsx?v=20260501-anim-reset-3"></script>
<script type="text/babel" src="SplitSlide.jsx?v=20260502-piano-footer-3"></script>
<script type="text/babel" src="ClosingSlide.jsx?v=20260502-piano-footer-3"></script>
<script type="text/babel" src="AnimatedPianoSlide.jsx?v=20260501-anim-reset-3"></script>
<script type="text/babel" src="AnimatedVectorSlide.jsx?v=20260501-anim-reset-3"></script>
<script type="text/babel" src="AnimatedPCSetSlide.jsx?v=20260502-piano-footer-3"></script>
<script type="text/babel" src="AnimatedSchematicSlide.jsx?v=20260502-piano-reference-4"></script>
<script type="text/babel" src="IntervalRoughnessSlide.jsx?v=20260502-roughness-code-1"></script>
<script type="text/babel" src="CMajorVectorSlide.jsx?v=20260502-piano-footer-3"></script>
<script type="text/babel" src="ChordsToVectorsSlide.jsx?v=20260502-piano-footer-3"></script>
<script type="text/babel" src="AnimatedNarrativeBlockSlides.jsx?v=20260502-narrative-block-1"></script>

<script type="text/babel">
const DEPT = "Facultad de Ciencias · Matemáticas Aplicadas";
const slideNumber = (slideId) => {
  const slides = Array.from(document.querySelectorAll('deck-stage > section'));
  const index = slides.findIndex((slide) => slide.id === slideId);
  return index >= 0 ? index + 1 : undefined;
};

// --- Render Cover ---
ReactDOM.createRoot(document.getElementById('slide-cover')).render(
  <CoverSlide
    title="Modelo computacional para la exploración de acordes en la composición musical"
    author="Hernán Santiago Angarita García"
    program="Maestría en Matemática Aplicada"
    director="Director: Andrés Torres"
    codirector="Codirector: Francisco Gómez"
    university="Universidad Nacional de Colombia"
    date="2026"
  />
);

// --- Render Title ---
ReactDOM.createRoot(document.getElementById('slide-title')).render(
  <TitleSlide
    pageNum={slideNumber('slide-title')}
    title="Computational Exploration of a Musical Chord Space"
    subtitle="Una representación perceptual para acordes musicales"
    department={DEPT}
  />
);

// --- Render Content ---
ReactDOM.createRoot(document.getElementById('slide-content')).render(
  <AnimatedPianoSlide pageNum={slideNumber('slide-content')} department={DEPT} />
);

// --- Render Diagram ---
ReactDOM.createRoot(document.getElementById('slide-diagram')).render(
  <AnimatedVectorSlide pageNum={slideNumber('slide-diagram')} department={DEPT} />
);

// --- Render Split ---
ReactDOM.createRoot(document.getElementById('slide-split')).render(
  <AnimatedPCSetSlide pageNum={slideNumber('slide-split')} department={DEPT} />
);

// --- Render Closing ---
ReactDOM.createRoot(document.getElementById('slide-closing')).render(
  <AnimatedSchematicSlide pageNum={slideNumber('slide-closing')} department={DEPT} />
);

// --- Render Interval Roughness ---
ReactDOM.createRoot(document.getElementById('slide-interval')).render(
  <IntervalRoughnessSlide pageNum={slideNumber('slide-interval')} department={DEPT} />
);

// --- Render Chords To Vectors Diagram ---
ReactDOM.createRoot(document.getElementById('slide-chords-vectors')).render(
  <ChordsToVectorsSlide pageNum={slideNumber('slide-chords-vectors')} department={DEPT} />
);

// --- Render Pilot Slides ---
ReactDOM.createRoot(document.getElementById('slide-pilot-question')).render(
  <ResearchQuestionSlide pageNum={slideNumber('slide-pilot-question')} department={DEPT} />
);

ReactDOM.createRoot(document.getElementById('slide-pilot-focus')).render(
  <MusicalFocusSlide pageNum={slideNumber('slide-pilot-focus')} department={DEPT} />
);

ReactDOM.createRoot(document.getElementById('slide-pilot-complements')).render(
  <ComplementIntervalsSlide pageNum={slideNumber('slide-pilot-complements')} department={DEPT} />
);

ReactDOM.createRoot(document.getElementById('slide-pilot-bins')).render(
  <TwelveBinsSlide pageNum={slideNumber('slide-pilot-bins')} department={DEPT} />
);

// --- Render Animated Narrative Block ---
ReactDOM.createRoot(document.getElementById('slide-exploration-problem')).render(
  <ExplorationProblemSlide pageNum={slideNumber('slide-exploration-problem')} department={DEPT} />
);

ReactDOM.createRoot(document.getElementById('slide-research-question-rich')).render(
  <ResearchQuestionAnimatedSlide pageNum={slideNumber('slide-research-question-rich')} department={DEPT} />
);

ReactDOM.createRoot(document.getElementById('slide-substitution-hypothesis')).render(
  <HypothesisSubstitutionSlide pageNum={slideNumber('slide-substitution-hypothesis')} department={DEPT} />
);

ReactDOM.createRoot(document.getElementById('slide-representation-requirements')).render(
  <RepresentationRequirementsSlide pageNum={slideNumber('slide-representation-requirements')} department={DEPT} />
);
</script>
</body>
</html>
