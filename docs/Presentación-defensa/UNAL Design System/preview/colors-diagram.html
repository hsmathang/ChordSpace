<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f5f5f5; font-family: sans-serif; padding: 20px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.swatch { width: 110px; }
.color-block { height: 72px; }
.label { font-size: 11px; font-family: 'Raleway', sans-serif; color: #333; margin-top: 6px; font-weight: 600; }
.hex { font-size: 10px; color: #777; margin-top: 2px; font-family: monospace; }
.section-label { font-size: 10px; font-family: 'Raleway', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #888; margin-bottom: 8px; }
.group { margin-bottom: 16px; }
</style>
</head>
<body>
<div class="group">
  <div class="section-label">Diagram Palette</div>
  <div class="row">
    <div class="swatch"><div class="color-block" style="background:#1E6BB8;"></div><div class="label">Diagram Blue</div><div class="hex">#1E6BB8</div></div>
    <div class="swatch"><div class="color-block" style="background:#5B9BD5;"></div><div class="label">Blue Light</div><div class="hex">#5B9BD5</div></div>
    <div class="swatch"><div class="color-block" style="background:#C0392B;"></div><div class="label">Diagram Red</div><div class="hex">#C0392B</div></div>
    <div class="swatch"><div class="color-block" style="background:#27AE60;"></div><div class="label">Diagram Green</div><div class="hex">#27AE60</div></div>
    <div class="swatch"><div class="color-block" style="background:#777777;"></div><div class="label">Diagram Gray</div><div class="hex">#777777</div></div>
    <div class="swatch"><div class="color-block" style="background:#8E44AD;"></div><div class="label">Diagram Purple</div><div class="hex">#8E44AD</div></div>
  </div>
</div>
<div class="group">
  <div class="section-label">Usage — Color-coded Flows</div>
  <div style="background:#fff; padding:16px; display:flex; flex-direction:column; gap:8px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:32px;height:4px;background:#C0392B;"></div>
      <span style="font-size:12px; color:#C0392B; font-family:'Raleway',sans-serif; font-weight:600;">(4,7,3) — Vector 1 / Error</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:32px;height:4px;background:#1E6BB8;"></div>
      <span style="font-size:12px; color:#1E6BB8; font-family:'Raleway',sans-serif; font-weight:600;">(3,8,5) — Vector 2 / Primary</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:32px;height:4px;background:#27AE60;"></div>
      <span style="font-size:12px; color:#27AE60; font-family:'Raleway',sans-serif; font-weight:600;">(5,9,4) — Vector 3 / Secondary</span>
    </div>
  </div>
</div>
</body>
</html>
