<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f8f8f8; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
.label { font-size: 9px; font-family: 'Raleway',sans-serif; text-transform: uppercase; letter-spacing: 0.12em; color: #aaa; margin-bottom: 8px; font-weight: 700; }
.demo { background: #fff; padding: 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.token { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bar { background: #1B7A3E; width: 24px; }
.tok-label { font-size: 9px; font-family: 'Raleway', sans-serif; color: #888; }
.tok-val { font-size: 10px; font-family: monospace; color: #444; font-weight: 600; }
</style>
</head>
<body>

<div>
  <div class="label">Spacing Scale</div>
  <div class="demo">
    <div class="token"><div class="bar" style="height:4px;"></div><div class="tok-label">space-1</div><div class="tok-val">4px</div></div>
    <div class="token"><div class="bar" style="height:8px;"></div><div class="tok-label">space-2</div><div class="tok-val">8px</div></div>
    <div class="token"><div class="bar" style="height:12px;"></div><div class="tok-label">space-3</div><div class="tok-val">12px</div></div>
    <div class="token"><div class="bar" style="height:16px;"></div><div class="tok-label">space-4</div><div class="tok-val">16px</div></div>
    <div class="token"><div class="bar" style="height:24px;"></div><div class="tok-label">space-5</div><div class="tok-val">24px</div></div>
    <div class="token"><div class="bar" style="height:32px;"></div><div class="tok-label">space-6</div><div class="tok-val">32px</div></div>
    <div class="token"><div class="bar" style="height:48px;"></div><div class="tok-label">space-7</div><div class="tok-val">48px</div></div>
    <div class="token"><div class="bar" style="height:64px;"></div><div class="tok-label">space-8</div><div class="tok-val">64px</div></div>
    <div class="token"><div class="bar" style="height:96px;"></div><div class="tok-label">space-9</div><div class="tok-val">96px</div></div>
  </div>
</div>

<div>
  <div class="label">Border Radius — Zero radius system</div>
  <div class="demo">
    <div class="token">
      <div style="width:40px;height:40px;background:#1B7A3E;border-radius:0;"></div>
      <div class="tok-label">radius-none</div><div class="tok-val">0px</div>
    </div>
    <div class="token">
      <div style="width:40px;height:40px;background:#E8610A;border-radius:2px;"></div>
      <div class="tok-label">radius-sm</div><div class="tok-val">2px</div>
    </div>
  </div>
</div>

<div>
  <div class="label">Slide Margins</div>
  <div class="demo" style="position:relative;width:280px;height:100px;padding:0;overflow:hidden;border:1px solid #eee;">
    <div style="position:absolute;inset:0;background:#fff;"></div>
    <div style="position:absolute;top:0;bottom:0;left:0;width:40px;background:rgba(27,122,62,0.07);display:flex;align-items:center;justify-content:center;">
      <span style="font-size:8px;color:#1B7A3E;font-family:'Raleway',sans-serif;writing-mode:vertical-rl;">64px</span>
    </div>
    <div style="position:absolute;top:0;left:40px;right:40px;height:24px;background:rgba(232,160,32,0.1);display:flex;align-items:center;justify-content:center;">
      <span style="font-size:8px;color:#E8A020;font-family:'Raleway',sans-serif;">48px top</span>
    </div>
    <div style="position:absolute;bottom:0;left:40px;right:40px;height:24px;background:rgba(240,235,224,1);display:flex;align-items:center;justify-content:center;">
      <span style="font-size:8px;color:#888;font-family:'Raleway',sans-serif;">footer 36px</span>
    </div>
    <div style="position:absolute;top:0;bottom:0;right:0;width:40px;background:rgba(27,122,62,0.07);display:flex;align-items:center;justify-content:center;">
      <span style="font-size:8px;color:#1B7A3E;font-family:'Raleway',sans-serif;writing-mode:vertical-rl;">64px</span>
    </div>
  </div>
</div>

</body>
</html>
