<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f5f5f5; font-family: sans-serif; padding: 20px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.swatch { width: 110px; }
.color-block { height: 72px; border-radius: 0; }
.label { font-size: 11px; font-family: 'Raleway', sans-serif; color: #333; margin-top: 6px; font-weight: 600; }
.hex { font-size: 10px; color: #777; margin-top: 2px; font-family: monospace; }
.section-label { font-size: 10px; font-family: 'Raleway', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #888; margin-bottom: 8px; }
.group { margin-bottom: 16px; }
</style>
</head>
<body>
<div class="group">
  <div class="section-label">Brand Greens</div>
  <div class="row">
    <div class="swatch"><div class="color-block" style="background:#1B7A3E;"></div><div class="label">UNAL Green</div><div class="hex">#1B7A3E</div></div>
    <div class="swatch"><div class="color-block" style="background:#145F30;"></div><div class="label">Green Dark</div><div class="hex">#145F30</div></div>
    <div class="swatch"><div class="color-block" style="background:#2DC56E;"></div><div class="label">Green Light</div><div class="hex">#2DC56E</div></div>
    <div class="swatch"><div class="color-block" style="background:#E8F5EE; border: 1px solid #ddd;"></div><div class="label">Green Subtle</div><div class="hex">#E8F5EE</div></div>
  </div>
</div>
<div class="group">
  <div class="section-label">Accent</div>
  <div class="row">
    <div class="swatch"><div class="color-block" style="background:#E8A020;"></div><div class="label">UNAL Gold</div><div class="hex">#E8A020</div></div>
    <div class="swatch"><div class="color-block" style="background:#C4841A;"></div><div class="label">Gold Dark</div><div class="hex">#C4841A</div></div>
    <div class="swatch"><div class="color-block" style="background:#E8610A;"></div><div class="label">UNAL Orange</div><div class="hex">#E8610A</div></div>
    <div class="swatch"><div class="color-block" style="background:#FDE8D8; border:1px solid #ddd;"></div><div class="label">Orange Light</div><div class="hex">#FDE8D8</div></div>
  </div>
</div>
<div class="group">
  <div class="section-label">Neutrals</div>
  <div class="row">
    <div class="swatch"><div class="color-block" style="background:#1A1A1A;"></div><div class="label">Near Black</div><div class="hex">#1A1A1A</div></div>
    <div class="swatch"><div class="color-block" style="background:#444444;"></div><div class="label">Gray Dark</div><div class="hex">#444444</div></div>
    <div class="swatch"><div class="color-block" style="background:#888888;"></div><div class="label">Gray Mid</div><div class="hex">#888888</div></div>
    <div class="swatch"><div class="color-block" style="background:#F0EBE0; border:1px solid #ddd;"></div><div class="label">UNAL Beige</div><div class="hex">#F0EBE0</div></div>
    <div class="swatch"><div class="color-block" style="background:#FFFFFF; border:1px solid #ddd;"></div><div class="label">White</div><div class="hex">#FFFFFF</div></div>
  </div>
</div>
</body>
</html>
