<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #eee; padding: 16px; display: flex; gap: 14px; flex-wrap: wrap; }
.label { font-size: 9px; font-family: 'Raleway',sans-serif; text-transform: uppercase; letter-spacing: 0.1em; color: #999; margin-bottom: 6px; font-weight: 700; }
.slide { width: 260px; height: 155px; position: relative; overflow: hidden; background: #fff; }
.at { position: absolute; top: 8px; right: 0; width: 55%; height: 2px; background: #E8A020; }
.ab { position: absolute; bottom: 32px; left: 8px; width: 32px; height: 2px; background: #2DC56E; }
.footer { position: absolute; bottom: 0; left: 0; right: 0; height: 30px; background: #F0EBE0; }
</style>
</head>
<body>

<div>
  <div class="label">White — Content</div>
  <div class="slide">
    <div class="at"></div>
    <div style="padding:20px 20px 40px;">
      <div style="font-family:'Playfair Display',serif;font-weight:800;font-size:16px;color:#1B7A3E;margin-bottom:4px;">Intro musical</div>
      <div style="font-size:9px;color:#444;font-family:'Raleway',sans-serif;line-height:1.5;">Nota: Do — {48}<br>Intervalo: Do-Mi — {48, 52}<br>Acorde: Cm — {48, 52, 55}</div>
    </div>
    <div class="ab"></div>
    <div class="footer"></div>
  </div>
</div>

<div>
  <div class="label">Split — Orange / White</div>
  <div class="slide" style="display:flex;">
    <div style="width:42%;background:#fff;padding:12px 10px;display:flex;flex-direction:column;gap:4px;justify-content:center;">
      <div style="font-size:8px;font-family:'Raleway',sans-serif;color:#1A1A1A;">C={0,4,7}</div>
      <div style="font-size:8px;font-family:'Raleway',sans-serif;color:#1A1A1A;">Am={9,0,4}</div>
      <div style="font-size:8px;font-family:'Raleway',sans-serif;color:#1A1A1A;">B<sub>dim</sub>={11,2,5}</div>
    </div>
    <div style="width:58%;background:#E8610A;padding:12px;display:flex;flex-direction:column;justify-content:space-between;">
      <div style="font-family:'Raleway',sans-serif;font-weight:700;font-size:10px;color:#fff;text-transform:uppercase;letter-spacing:0.12em;">PC-Set Theory</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <div style="font-size:11px;font-weight:700;color:#fff;font-family:'Raleway',sans-serif;">(4,7) →</div>
        <div style="font-size:11px;font-weight:700;color:#fff;font-family:'Raleway',sans-serif;">(3,7) →</div>
        <div style="font-size:11px;font-weight:700;color:#fff;font-family:'Raleway',sans-serif;">(3,6) →</div>
      </div>
    </div>
  </div>
</div>

<div>
  <div class="label">Full Green — Cover / Close</div>
  <div class="slide" style="background:#1B7A3E;">
    <div style="position:absolute;top:8px;right:0;width:40%;height:2px;background:#E8A020;"></div>
    <div style="position:absolute;top:8px;right:42%;width:4%;height:2px;background:#2DC56E;"></div>
    <div style="display:flex;align-items:center;justify-content:center;height:100%;">
      <div style="font-family:'Playfair Display',serif;font-weight:400;font-size:28px;color:#fff;font-style:italic;">Gracias</div>
    </div>
    <div style="position:absolute;bottom:14px;left:8px;width:28px;height:2px;background:#2DC56E;"></div>
    <div style="position:absolute;bottom:10px;left:8px;width:16px;height:2px;background:#2DC56E;"></div>
  </div>
</div>

</body>
</html>
