<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Revision de imagenes ChordSpace - lote 2</title><style>
:root{--bg:#f7f5ef;--ink:#171717;--muted:#6b675f;--line:#d8d2c4;--green:#247a4a;--red:#a13d35;--amber:#9b6b18}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:2;padding:14px 18px;background:rgba(247,245,239,.96);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}h1{font-size:18px;margin:0}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}input,select,button{height:34px;border:1px solid var(--line);background:white;color:var(--ink);border-radius:6px;padding:0 10px;font-size:13px}button{cursor:pointer}main{padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-height:320px}.thumb{height:180px;background:#e8e2d4;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}.thumb img{max-width:100%;max-height:100%;object-fit:contain;display:block;cursor:zoom-in}.meta{padding:10px;display:grid;gap:7px}.label{font-weight:700;font-size:14px;line-height:1.25}.path{color:var(--muted);font-size:12px;line-height:1.25;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px}.actions button{padding:0 6px}.card[data-state="useful"]{border-color:var(--green);box-shadow:0 0 0 2px rgba(36,122,74,.16)}.card[data-state="reject"]{opacity:.62;border-color:var(--red)}.card[data-state="maybe"]{border-color:var(--amber);box-shadow:0 0 0 2px rgba(155,107,24,.15)}button[data-state="useful"].active{background:var(--green);color:white}button[data-state="reject"].active{background:var(--red);color:white}button[data-state="maybe"].active{background:var(--amber);color:white}.preview{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:4;display:none;align-items:center;justify-content:center;padding:24px}.preview.open{display:flex}.preview img{max-width:96vw;max-height:88vh;background:white}.preview .caption{position:absolute;left:24px;right:24px;bottom:10px;color:white;font-size:13px;overflow-wrap:anywhere}.summary{font-size:13px;color:var(--muted)}.exportBox{position:fixed;inset:30px;z-index:5;background:white;border:1px solid var(--line);border-radius:8px;display:none;grid-template-rows:auto 1fr auto;gap:10px;padding:14px}.exportBox.open{display:grid}.exportBox textarea{width:100%;height:100%;resize:none;border:1px solid var(--line);padding:10px;font-family:Consolas,monospace;font-size:13px}.exportBox .bar{display:flex;gap:8px;justify-content:space-between;align-items:center}@media(max-width:720px){header{grid-template-columns:1fr}.controls{justify-content:flex-start}}
</style></head><body><header><div><h1>Revision de imagenes ChordSpace - lote 2</h1><div class="summary" id="summary"></div></div><div class="controls"><input id="q" placeholder="Buscar"><select id="filter"><option value="all">Todas</option><option value="useful">Utiles</option><option value="maybe">Duda</option><option value="reject">No utiles</option><option value="unmarked">Sin marcar</option></select><button id="exportBtn">Exportar seleccion</button></div></header><main><div class="grid" id="grid"></div></main><div class="preview" id="preview"><img alt=""><div class="caption"></div></div><div class="exportBox" id="exportBox"><div class="bar"><strong>Seleccion exportada</strong><button id="closeExport">Cerrar</button></div><textarea id="exportText"></textarea><div class="summary">Si el portapapeles no funciona, selecciona el texto y copialo manualmente.</div></div><script>
const items = [{"label": "MAPI propuesta nueva: DesviacionalCentroide porGrupo", "name": "DesviacionalCentroide_porGrupo.png", "path": "docs/Tesis_Maestría_Matemáticas_Aplicadas_UNAL_2024_entregada/MAPI_3_propuesta/DesviacionalCentroide_porGrupo.png", "size": 27861, "score": 5}, {"label": "MAPI propuesta nueva: Distanciamedia porgrupo", "name": "Distanciamedia_porgrupo.png", "path": "docs/Tesis_Maestría_Matemáticas_Aplicadas_UNAL_2024_entregada/MAPI_3_propuesta/Distanciamedia_porgrupo.png", "size": 19610, "score": 5}, {"label": "MAPI propuesta nueva: Medidas dispersion multidim", "name": "Medidas_dispersion_multidim.png", "path": "docs/Tesis_Maestría_Matemáticas_Aplicadas_UNAL_2024_entregada/MAPI_3_propuesta/Medidas_dispersion_multidim.png", "size": 25766, "score": 5}, {"label": "MAPI propuesta nueva: our characteristics", "name": "our_characteristics.jpeg", "path": "docs/Tesis_Maestría_Matemáticas_Aplicadas_UNAL_2024_entregada/MAPI_3_propuesta/our_characteristics.jpeg", "size": 46489, "score": 5}, {"label": "MAPI propuesta nueva: Usual characterization", "name": "Usual_characterization.jpeg", "path": "docs/Tesis_Maestría_Matemáticas_Aplicadas_UNAL_2024_entregada/MAPI_3_propuesta/Usual_characterization.jpeg", "size": 41256, "score": 5}, {"label": "MAPI propuesta nueva: Varianza porGrupo", "name": "Varianza_porGrupo.png", "path": "docs/Tesis_Maestría_Matemáticas_Aplicadas_UNAL_2024_entregada/MAPI_3_propuesta/Varianza_porGrupo.png", "size": 15609, "score": 5}, {"label": "Captura diagnostico nueva: institution check slide 01", "name": "institution-check-slide-01.png", "path": "docs/Presentación-defensa/UNAL Design System/diagnostico-capturas/institution-check-slide-01.png", "size": 39582, "score": -1}, {"label": "Captura diagnostico nueva: institution check slide 02", "name": "institution-check-slide-02.png", "path": "docs/Presentación-defensa/UNAL Design System/diagnostico-capturas/institution-check-slide-02.png", "size": 65574, "score": -1}, {"label": "Captura diagnostico nueva: institution check slide 09", "name": "institution-check-slide-09.png", "path": "docs/Presentación-defensa/UNAL Design System/diagnostico-capturas/institution-check-slide-09.png", "size": 54763, "score": -1}, {"label": "Captura diagnostico nueva: slide 01", "name": "slide-01.png", "path": "docs/Presentación-defensa/UNAL Design System/diagnostico-capturas/slide-01.png", "size": 29152, "score": -1}, {"label": "Captura diagnostico nueva: slide 02", "name": "slide-02.png", "path": "docs/Presentación-defensa/UNAL Design System/diagnostico-capturas/slide-02.png", "size": 62747, "score": -1}, {"label": "Captura diagnostico nueva: slide 03", "name": "slide-03.png", "path": "docs/Presentación-defensa/UNAL Design System/diagnostico-capturas/slide-03.png", "size": 30920, "score": -1}, {"label": "Captura diagnostico nueva: slide 04", "name": "slide-04.png", "path": "docs/Presentación-defensa/UNAL Design System/diagnostico-capturas/slide-04.png", "size": 30566, "score": -1}, {"label": "Captura diagnostico nueva: slide 05", "name": "slide-05.png", "path": "docs/Presentación-defensa/UNAL Design System/diagnostico-capturas/slide-05.png", "size": 63512, "score": -1}, {"label": "Captura diagnostico nueva: slide 06", "name": "slide-06.png", "path": "docs/Presentación-defensa/UNAL Design System/diagnostico-capturas/slide-06.png", "size": 50304, "score": -1}, {"label": "Captura diagnostico nueva: slide 07", "name": "slide-07.png", "path": "docs/Presentación-defensa/UNAL Design System/diagnostico-capturas/slide-07.png", "size": 107687, "score": -1}, {"label": "Captura diagnostico nueva: slide 08", "name": "slide-08.png", "path": "docs/Presentación-defensa/UNAL Design System/diagnostico-capturas/slide-08.png", "size": 30900, "score": -1}, {"label": "Captura diagnostico nueva: slide 09 redesign final", "name": "slide-09-redesign-final.png", "path": "docs/Presentación-defensa/UNAL Design System/diagnostico-capturas/slide-09-redesign-final.png", "size": 110104, "score": -1}, {"label": "Captura diagnostico nueva: slide 09 redesign", "name": "slide-09-redesign.png", "path": "docs/Presentación-defensa/UNAL Design System/diagnostico-capturas/slide-09-redesign.png", "size": 54324, "score": -1}, {"label": "Captura diagnostico nueva: slide 09", "name": "slide-09.png", "path": "docs/Presentación-defensa/UNAL Design System/diagnostico-capturas/slide-09.png", "size": 49952, "score": -1}];
const key='chordspace-image-review-v2'; const state=JSON.parse(localStorage.getItem(key)||'{}'); const grid=document.querySelector('#grid'), q=document.querySelector('#q'), filter=document.querySelector('#filter'), summary=document.querySelector('#summary'), preview=document.querySelector('#preview'), exportBox=document.querySelector('#exportBox'), exportText=document.querySelector('#exportText');
function save(){localStorage.setItem(key,JSON.stringify(state))} function enc(path){return path.split('/').map(encodeURIComponent).join('/')} function setState(path,value){state[path]=state[path]===value?'':value;save();render()}
function render(){const term=q.value.trim().toLowerCase(), f=filter.value; grid.innerHTML=''; let shown=0; const counts={useful:0,maybe:0,reject:0,unmarked:0}; for(const item of items){const s=state[item.path]||''; if(s)counts[s]++;else counts.unmarked++; const hay=(item.label+' '+item.name+' '+item.path).toLowerCase(); if(term&&!hay.includes(term))continue; if(f!=='all'&&(f==='unmarked'?!!s:s!==f))continue; shown++; const card=document.createElement('article'); card.className='card'; card.dataset.state=s; const src=enc(item.path); card.innerHTML=`<div class="thumb"><img src="/${src}" alt="${item.name}" loading="lazy"></div><div class="meta"><div class="label">${item.label}</div><div class="path">${item.path}</div><div class="actions"><button data-state="useful">Util</button><button data-state="maybe">Duda</button><button data-state="reject">No util</button></div></div>`; card.querySelector('img').addEventListener('click',()=>{preview.classList.add('open');preview.querySelector('img').src='/'+src;preview.querySelector('.caption').textContent=item.path}); card.querySelectorAll('button[data-state]').forEach(btn=>{btn.classList.toggle('active',btn.dataset.state===s);btn.addEventListener('click',()=>setState(item.path,btn.dataset.state))}); grid.appendChild(card)} summary.textContent=`${shown} visibles de ${items.length} ? utiles: ${counts.useful} ? duda: ${counts.maybe} ? no utiles: ${counts.reject} ? sin marcar: ${counts.unmarked}`}
function exportMarkdown(){return ['# Seleccion de imagenes para defensa - lote 2','','## Utiles',...items.filter(i=>state[i.path]==='useful').map(i=>`- ${i.label}: ${i.path}`),'','## Duda',...items.filter(i=>state[i.path]==='maybe').map(i=>`- ${i.label}: ${i.path}`),'','## No utiles',...items.filter(i=>state[i.path]==='reject').map(i=>`- ${i.label}: ${i.path}`),'','## Sin marcar',...items.filter(i=>!state[i.path]).map(i=>`- ${i.label}: ${i.path}`)].join('\n')}
preview.addEventListener('click',()=>preview.classList.remove('open')); q.addEventListener('input',render); filter.addEventListener('change',render); document.querySelector('#closeExport').addEventListener('click',()=>exportBox.classList.remove('open')); document.querySelector('#exportBtn').addEventListener('click',async()=>{const text=exportMarkdown(); exportText.value=text; exportBox.classList.add('open'); exportText.focus(); exportText.select(); try{await navigator.clipboard.writeText(text)}catch(e){console.warn('Clipboard unavailable',e)}}); render();
</script></body></html>
